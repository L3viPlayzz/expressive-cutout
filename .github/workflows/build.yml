
name: Build

on:
  push:
    branches: [main, dev, xtreme-v1, nexora-reborn, nexora-momentum]
  pull_request:
    branches: [main, dev, xtreme-v1, nexora-reborn, nexora-momentum]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Test NEXORA motion and timing policy
        if: github.ref_name == 'nexora-reborn' || github.ref_name == 'nexora-momentum'
        run: ./gradlew testDebugUnitTest --tests "com.ekoehler.expressivecutout.nexora.NexoraPolicyTest" --no-daemon

      - name: Android lint (release gate)
        run: ./gradlew lintDebug --no-daemon

      - name: Publish lint diagnostics
        if: always()
        run: |
          report=app/build/reports/lint-results-debug.xml
          if [ -f "$report" ]; then
            python3 -c 'import xml.etree.ElementTree as E; r=E.parse("app/build/reports/lint-results-debug.xml"); print("\n".join("{} {}: {} — {}".format(i.get("severity"),i.get("id"),i.find("location").get("file") if i.find("location") is not None else "",i.get("message")) for i in r.findall("issue")))'
          fi

      - name: Prepare NEXORA APK (only after release checks pass)
        run: cp app/build/outputs/apk/debug/app-debug.apk NEXORA.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA
          path: NEXORA.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
