name: Build NEXORA editions
on:
  push:
    branches: [nexora-momentum]
  pull_request:
    branches: [nexora-momentum]
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Consumer
            artifact: NEXORA
            folder: consumer
          - variant: Developer
            artifact: NEXORA-Dev
            folder: developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble edition
        run: ./gradlew assemble${{ matrix.variant }}Debug --no-daemon
      - name: Test NEXORA policy
        run: ./gradlew test${{ matrix.variant }}DebugUnitTest --tests "com.ekoehler.expressivecutout.nexora.NexoraPolicyTest" --no-daemon
      - name: Android lint (release gate)
        run: ./gradlew lint${{ matrix.variant }}Debug --no-daemon
      - name: Prepare edition APK
        run: cp app/build/outputs/apk/${{ matrix.folder }}/debug/app-${{ matrix.folder }}-debug.apk ${{ matrix.artifact }}.apk
      - name: Upload edition APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.apk
          if-no-files-found: error
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ matrix.folder }}
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore
