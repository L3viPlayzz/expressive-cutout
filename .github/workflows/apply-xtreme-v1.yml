name: Apply Expressive Cutout Xtreme v1

on:
  push:
    branches: [dev]
    paths:
      - 'Expressive_Cutout_Xtreme_v1_Changed_Files.zip'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Verify and apply Xtreme files
        shell: bash
        run: |
          set -euo pipefail
          archive="Expressive_Cutout_Xtreme_v1_Changed_Files.zip"
          test -f "$archive"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive=Path("Expressive_Cutout_Xtreme_v1_Changed_Files.zip")
          allowed={
            "XTREME_README.md",
            "app/build.gradle.kts",
            "app/src/debug/res/values/strings.xml",
            "app/src/main/java/com/ekoehler/expressivecutout/core/InboxNotification.kt",
            "app/src/main/java/com/ekoehler/expressivecutout/core/NotificationInboxBus.kt",
            "app/src/main/java/com/ekoehler/expressivecutout/data/BehaviourPreferences.kt",
            "app/src/main/java/com/ekoehler/expressivecutout/overlay/DynamicIsland.kt",
            "app/src/main/java/com/ekoehler/expressivecutout/overlay/InboxLayout.kt",
            "app/src/main/java/com/ekoehler/expressivecutout/overlay/IslandOverlayController.kt",
            "app/src/main/java/com/ekoehler/expressivecutout/service/CutoutNotificationListenerService.kt",
            "app/src/main/java/com/ekoehler/expressivecutout/ui/screen/SettingScreens/GestureScreen.kt",
            "app/src/main/java/com/ekoehler/expressivecutout/ui/screen/SettingScreens/ShowsWhenEmptyScreen.kt",
            "app/src/main/res/values/strings.xml",
          }
          with zipfile.ZipFile(archive) as z:
              names={x.filename for x in z.infolist() if not x.is_dir()}
              if names!=allowed:
                  raise SystemExit(f"Unexpected ZIP paths; expected {len(allowed)} files, got: {sorted(names ^ allowed)}")
              for item in z.infolist():
                  if item.is_dir():
                      continue
                  dest=Path(item.filename)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(item))
          print("Applied all 13 expected files")
          PY
          rm "$archive"
          git rm --ignore-unmatch .github/workflows/apply-xtreme-v1.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply Expressive Cutout Xtreme v1 files"
          git push origin HEAD:dev
